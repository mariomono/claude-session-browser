server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Transcripts are multi-megabyte JSON; compress it and the app shell.
    # text/html is always compressed once gzip is on; "proxied any" also
    # covers requests arriving through another proxy.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A forced rescan re-reads every session log and can take a while.
        proxy_read_timeout 300s;
    }

    # Vite puts a content hash in every file name here, so a file never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell names the current hashed assets; always revalidate it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

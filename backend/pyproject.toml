[project]
name = "app"
version = "0.1.0"
description = "Claude Session Browser backend: session index, transcript and resume API"
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff==0.14.1",  # keep in sync with the ruff-pre-commit rev in .pre-commit-config.yaml
    "ty>=0.0.84",
    "pre-commit>=4.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.ruff]
line-length=120

[tool.ruff.lint]
extend-select = ["E501"]
select = [
    "F",
    "W",
    "E",
    "I",
]
ignore = [
    "E712",
]

[tool.ruff.format]
quote-style = "preserve"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

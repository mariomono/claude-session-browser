repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: debug-statements
        files: ^backend/
      - id: detect-private-key
      - id: mixed-line-ending
      - id: no-commit-to-branch
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in sync with the ruff pin in backend/pyproject.toml.
    rev: v0.14.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # Runs the project-pinned ty from backend/.venv (uv sync installs it),
      # so the type checker resolves backend/pyproject.toml in this monorepo
      # layout - the official ty-pre-commit hook only checks the repo root.
      - id: ty
        name: ty
        entry: bash -c 'cd backend && uv run ty check'
        language: system
        types_or: [python, pyi]
        files: ^backend/
        pass_filenames: false
        require_serial: true
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.23.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']
